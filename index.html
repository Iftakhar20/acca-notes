<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCA Study Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #F7F6F2;
  --white:   #FFFFFF;
  --ink:     #111110;
  --ink-2:   #3D3C38;
  --ink-3:   #8A897F;
  --rule:    #E2E0D8;

  --tx:      #D63B1F;
  --tx-light:#FEF0ED;
  --tx-mid:  #E8694F;
  --tx-rule: #F5C4BA;

  --fm:      #1B4FD8;
  --fm-light:#EDF1FD;
  --fm-mid:  #4D78EE;
  --fm-rule: #BAC9F8;

  --aa:      #0F7A4A;
  --aa-light:#ECF8F2;
  --aa-mid:  #2EA66E;
  --aa-rule: #A8DFC3;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

/* ── subtle texture ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 80% 10%, rgba(214,59,31,0.05) 0%, transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(27,79,216,0.05) 0%, transparent 45%),
    radial-gradient(circle at 55% 55%, rgba(15,122,74,0.04) 0%, transparent 40%);
}

.page {
  position: relative; z-index: 1;
  max-width: 1020px; margin: 0 auto;
  padding: 0 1.5rem 6rem;
}

/* ══════════════ HERO ══════════════ */
.hero {
  padding: 5rem 0 4rem;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 2rem;
  border-bottom: 2px solid var(--ink);
  animation: up 0.7s ease both;
}
.hero-left {}
.hero-tag {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 1.25rem;
}
.hero h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(48px, 8vw, 88px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.hero h1 .accent-tx { color: var(--tx); }
.hero h1 .accent-fm { color: var(--fm); }
.hero h1 .accent-aa { color: var(--aa); }

.hero-right {
  text-align: right;
  padding-bottom: 0.4rem;
}
.hero-right p {
  font-size: 13px; color: var(--ink-3);
  line-height: 1.7; font-weight: 400;
}

/* ══════════════ NAV ══════════════ */
.nav-row {
  display: flex; gap: 0;
  margin: 0 0 3.5rem;
  animation: up 0.7s 0.1s ease both;
  border-bottom: 1px solid var(--rule);
}
.nav-tab {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 14px 28px;
  text-decoration: none;
  color: var(--ink-3);
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.nav-tab:hover { color: var(--ink); }
.nav-tab.tx:hover { border-color: var(--tx); color: var(--tx); }
.nav-tab.fm:hover { border-color: var(--fm); color: var(--fm); }
.nav-tab.aa:hover { border-color: var(--aa); color: var(--aa); }

/* ══════════════ SECTION ══════════════ */
.section { margin-bottom: 4rem; }

.section-head {
  display: flex; align-items: stretch; gap: 0;
  margin-bottom: 1.5rem;
  overflow: hidden; border-radius: 10px;
  border: 1.5px solid var(--rule);
}
.section-stamp {
  font-family: 'Syne', sans-serif;
  font-size: 52px; font-weight: 800;
  letter-spacing: -0.04em;
  color: white;
  padding: 18px 28px;
  display: flex; align-items: center; justify-content: center;
  min-width: 110px; line-height: 1;
}
.stamp-TX { background: var(--tx); }
.stamp-FM { background: var(--fm); }
.stamp-AA { background: var(--aa); }

.section-info {
  padding: 16px 22px;
  display: flex; flex-direction: column; justify-content: center;
  background: white; flex: 1;
}
.section-info h2 {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 700;
  color: var(--ink); letter-spacing: -0.01em;
  margin-bottom: 3px;
}
.section-info p {
  font-size: 12px; color: var(--ink-3);
  font-weight: 400; letter-spacing: 0.01em;
}

/* ══════════════ CARDS ══════════════ */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.card {
  display: flex; flex-direction: column;
  background: var(--white);
  border: 1.5px solid var(--rule);
  border-radius: 12px;
  padding: 22px 20px 18px;
  text-decoration: none; color: var(--ink);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  animation: cardIn 0.45s ease both;
  position: relative; overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  opacity: 0; transition: opacity 0.18s;
}
.card-TX::before { background: var(--tx); }
.card-FM::before { background: var(--fm); }
.card-AA::before { background: var(--aa); }
.card:hover { transform: translateY(-5px); }
.card:hover::before { opacity: 1; }
.card-TX:hover { border-color: var(--tx-rule); box-shadow: 0 10px 30px rgba(214,59,31,0.10); }
.card-FM:hover { border-color: var(--fm-rule); box-shadow: 0 10px 30px rgba(27,79,216,0.10); }
.card-AA:hover { border-color: var(--aa-rule); box-shadow: 0 10px 30px rgba(15,122,74,0.10); }

.card-emoji {
  font-size: 22px; margin-bottom: 14px; display: block; line-height: 1;
}
.card-name {
  font-family: 'Syne', sans-serif;
  font-size: 16px; font-weight: 700;
  line-height: 1.3; letter-spacing: -0.01em;
  color: var(--ink); flex: 1;
}
.card-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid var(--rule);
}
.card-subject {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px;
}
.subject-TX { color: var(--tx); background: var(--tx-light); }
.subject-FM { color: var(--fm); background: var(--fm-light); }
.subject-AA { color: var(--aa); background: var(--aa-light); }
.card-arrow {
  font-size: 18px; font-weight: 600;
  color: var(--rule); transition: color 0.18s, transform 0.18s;
}
.card:hover .card-arrow { transform: translateX(4px); }
.card-TX:hover .card-arrow { color: var(--tx); }
.card-FM:hover .card-arrow { color: var(--fm); }
.card-AA:hover .card-arrow { color: var(--aa); }

/* ── loading / error ── */
.loading {
  text-align: center; padding: 5rem 0;
  color: var(--ink-3); font-size: 14px;
}
.spinner {
  width: 30px; height: 30px;
  border: 2px solid var(--rule);
  border-top-color: var(--fm);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin: 0 auto 1rem;
}
.error-box {
  background: #fff5f5; border: 1.5px solid var(--tx-rule);
  border-radius: 10px; padding: 1.25rem 1.5rem;
  color: var(--tx); font-size: 13px; margin: 2rem 0;
}

/* ── footer ── */
.footer {
  margin-top: 4rem; padding-top: 2rem;
  border-top: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
}
.footer-brand {
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.02em; color: var(--ink);
}
.footer-note {
  font-size: 12px; color: var(--ink-3);
}

/* ── animations ── */
@keyframes up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
@keyframes cardIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; gap: 1rem; }
  .hero-right { text-align: left; }
  .cards-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card-name { font-size: 14px; }
  .section-stamp { font-size: 38px; padding: 14px 20px; min-width: 80px; }
  .nav-tab { padding: 12px 16px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <header class="hero">
    <div class="hero-left">
      <span class="hero-tag">June 2026 Exam Session</span>
      <h1>
        <span class="accent-tx">T</span><span class="accent-fm">X</span> ·
        <span class="accent-fm">F</span><span class="accent-aa">M</span> ·
        <span class="accent-aa">A</span><span class="accent-tx">A</span><br>
        Study Notes
      </h1>
    </div>
    <div class="hero-right">
      <p>Taxation<br>Financial Management<br>Audit &amp; Assurance</p>
    </div>
  </header>

  <!-- NAV -->
  <nav class="nav-row" id="navRow">
    <!-- injected -->
  </nav>

  <!-- CONTENT -->
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Loading your notes…
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-brand">ACCA Notes</span>
    <span class="footer-note">Hosted on GitHub Pages</span>
  </footer>

</div>

<script>
const OWNER  = 'Iftakhar20';
const REPO   = 'acca-notes';
const BRANCH = 'main';

const SUBJECT_META = {
  TX: { label: 'Taxation', sub: 'Finance Act 2025' },
  FM: { label: 'Financial Management', sub: 'Corporate Finance' },
  AA: { label: 'Audit & Assurance', sub: 'External Audit' },
};

const FILE_ICONS = {
  'cgt': '📊', 'capital gains': '📊',
  'corporation': '🏢',
  'employment': '👔',
  'inheritance': '🏛️', 'inheretence': '🏛️',
  'key dates': '📅', 'dates': '📅',
  'pension': '🔐', 'nic': '🔐',
  'refresher': '🔁',
  'revision': '⚡', 'cheatsheet': '⚡',
  'trading': '📈',
  'vat': '🧾',
  'investment': '💹',
  'function': '🎯', 'management function': '🎯',
  'audit report': '📋', 'reports': '📋',
  'quiz': '❓',
  'tcwg': '📝', 'tcwg_chapter': '📝',
  'automated': '🤖',
  'controls': '🔍',
  'ethics': '⚖️',
  'substantive': '🔬',
  'written': '✍️',
  'working capital': '💰',
  'week': '📅',
};

function getIcon(filename) {
  const lower = filename.toLowerCase();
  for (const [key, icon] of Object.entries(FILE_ICONS)) {
    if (lower.includes(key)) return icon;
  }
  return '📄';
}

function cleanName(filename) {
  return filename
    .replace(/\.html$/i, '')
    .replace(/^(TX|FM|AA)[_\s]+/i, '')
    .replace(/_/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

async function fetchFolder(folder) {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}?ref=${BRANCH}`;
  const res = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });
  if (!res.ok) return [];
  const items = await res.json();
  return items
    .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html'))
    .map(f => ({ name: f.name, path: f.path }));
}

async function buildPage() {
  const content = document.getElementById('content');
  const navRow  = document.getElementById('navRow');

  try {
    const [txFiles, fmFiles, aaFiles] = await Promise.all([
      fetchFolder('TX'), fetchFolder('FM'), fetchFolder('AA')
    ]);

    const sections = [
      { key: 'TX', files: txFiles },
      { key: 'FM', files: fmFiles },
      { key: 'AA', files: aaFiles },
    ].filter(s => s.files.length > 0);

    if (!sections.length) {
      content.innerHTML = '<div class="error-box">No HTML files found in TX, FM or AA folders.</div>';
      return;
    }

    // Nav tabs
    navRow.innerHTML = sections.map(s =>
      `<a href="#sec-${s.key}" class="nav-tab ${s.key.toLowerCase()}">${s.key} — ${SUBJECT_META[s.key].label}</a>`
    ).join('');

    // Sections + cards
    content.innerHTML = sections.map(({ key, files }) => {
      const meta = SUBJECT_META[key];
      const cards = files.map((f, i) => `
        <a class="card card-${key}" href="${f.path}" style="animation-delay:${i*0.05}s">
          <span class="card-emoji">${getIcon(f.name)}</span>
          <span class="card-name">${cleanName(f.name)}</span>
          <div class="card-meta">
            <span class="card-subject subject-${key}">${key}</span>
            <span class="card-arrow">→</span>
          </div>
        </a>`).join('');

      return `
        <section id="sec-${key}" class="section">
          <div class="section-head">
            <div class="section-stamp stamp-${key}">${key}</div>
            <div class="section-info">
              <h2>${meta.label}</h2>
              <p>${meta.sub}</p>
            </div>
          </div>
          <div class="cards-grid">${cards}</div>
        </section>`;
    }).join('');

  } catch (err) {
    content.innerHTML = `<div class="error-box">Could not load notes: ${err.message}</div>`;
  }
}

buildPage();
</script>
</body>
</html>
